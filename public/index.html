<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantiFlows</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            font-weight: bold;
            background-color: #f8f9fa;
        }
        .signal-long {
            border-left: 5px solid #198754;
        }
        .signal-short {
            border-left: 5px solid #dc3545;
        }
        .badge-long {
            background-color: rgba(25, 135, 84, 0.1);
            color: #198754;
            font-weight: bold;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .badge-short {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            font-weight: bold;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .coin-logo {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }
        .loading-bar {
            height: 3px;
            width: 100%;
            background-color: #e9ecef;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #0d6efd;
            width: 0%;
            transition: width 0.3s ease;
        }
        .signal-reason {
            font-size: 0.9rem;
            padding: 2px 0;
        }
        .indicator-value {
            font-size: 0.85rem;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #f8f9fa;
            margin: 2px;
        }
        .positive {
            color: #198754;
        }
        .negative {
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-primary mb-3" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
    </div>
    <div id="loadingText">Futures coinleri taranıyor...</div>
</div>

<div class="container my-4">
    <h2 class="mb-4">QuantiFlows</h2>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Zaman Dilimi:</label>
                    <select id="timeframeSelect" class="form-select">
                        <option value="15m">15 Dakika</option>
                        <option value="1h" selected>1 Saat</option>
                        <option value="4h">4 Saat</option>
                        <option value="1d">1 Gün</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Sinyal Tipi:</label>
                    <select id="signalTypeSelect" class="form-select">
                        <option value="all" selected>Hepsi</option>
                        <option value="long">Sadece Long</option>
                        <option value="short">Sadece Short</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Minimum Hacim (USDT):</label>
                    <select id="volumeSelect" class="form-select">
                        <option value="1000000">1 Milyon USDT+</option>
                        <option value="10000000" selected>10 Milyon USDT+</option>
                        <option value="50000000">50 Milyon USDT+</option>
                        <option value="100000000">100 Milyon USDT+</option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                    <span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Coin ara... (örn: BTC, ETH)">
                    </span>
                <button id="scanButton" class="btn btn-primary">
                    <span id="scanButtonText">Tara</span>
                    <span id="scanSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status" aria-hidden="true"></span>
                </button>
            </div>
            <div class="loading-bar mt-3" id="scanProgressBar">
                <div class="loading-bar-progress" id="scanProgressBarInner"></div>
            </div>
        </div>
    </div>

    <div class="alert alert-info d-flex justify-content-between align-items-center" role="alert">
        <div>
            <strong>Tarama Sonucu:</strong> <span id="scanResultInfo">Henüz tarama yapılmadı</span>
        </div>
        <small>Son tarama: <span id="lastScanTime">-</span></small>
    </div>

    <div class="row" id="signalsContainer">
        <!-- Sinyaller burada görüntülenecek -->
    </div>

    <div class="alert alert-warning d-none" id="noSignalsMessage">
        <strong>Üzgünüz!</strong> Seçilen kriterlere uygun sinyal bulunamadı. Lütfen farklı filtreler deneyin.
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Global değişkenler
    let allCoins = [];
    let signals = [];
    let coinData = {};
    let historicalData = {};
    let isScanning = false;
    let currentTimeframe = "1h";

    // Sayfa yüklendiğinde
    document.addEventListener('DOMContentLoaded', function() {
        // Tarama butonunu ayarla
        document.getElementById('scanButton').addEventListener('click', startScan);

        // Filtreleme işlemleri için event listener'lar
        document.getElementById('timeframeSelect').addEventListener('change', function() {
            currentTimeframe = this.value;
        });

        document.getElementById('signalTypeSelect').addEventListener('change', filterSignals);
        document.getElementById('volumeSelect').addEventListener('change', filterSignals);
        document.getElementById('searchInput').addEventListener('input', filterSignals);

        // İlk başlangıçta coinleri çek
        fetchAllCoins()
          .then(() => {
              document.getElementById('loadingOverlay').style.display = 'none';
          })
          .catch(error => {
              document.getElementById('loadingText').textContent = 'Hata: ' + error.message;
          });
    });

    // Tüm coinleri çek
    async function fetchAllCoins() {
        try {
            // Binance API'den tüm sembolleri çek
            const response = await fetch('https://api.binance.com/api/v3/exchangeInfo');
            if (!response.ok) throw new Error('Veri alınamadı');

            const data = await response.json();

            // USDT ile biten sembolleri filtrele
            allCoins = data.symbols
              .filter(symbol => symbol.status === 'TRADING' && symbol.quoteAsset === 'USDT')
              .map(symbol => {
                  return {
                      symbol: symbol.symbol,
                      baseAsset: symbol.baseAsset,
                      pricePrecision: symbol.pricePrecision
                  };
              });

            console.log(`${allCoins.length} coin bulundu`);

            // 24 saatlik istatistikleri çek
            await fetch24hStats();

            return allCoins;
        } catch (error) {
            console.error('Coinler çekilemedi:', error);
            throw error;
        }
    }

    // 24 saatlik istatistikleri çek
    async function fetch24hStats() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
            if (!response.ok) throw new Error('Veriler alınamadı');

            const stats = await response.json();

            coinData = {};
            stats.forEach(item => {
                coinData[item.symbol] = {
                    price: parseFloat(item.lastPrice),
                    priceChangePercent: parseFloat(item.priceChangePercent),
                    volume: parseFloat(item.quoteVolume),
                    high: parseFloat(item.highPrice),
                    low: parseFloat(item.lowPrice)
                };
            });

            return coinData;
        } catch (error) {
            console.error('İstatistikler çekilemedi:', error);
            return {};
        }
    }

    // Taramayı başlat
    async function startScan() {
        if (isScanning) return;

        isScanning = true;
        signals = [];

        // UI'yi güncelle
        const scanButton = document.getElementById('scanButton');
        const scanButtonText = document.getElementById('scanButtonText');
        const scanSpinner = document.getElementById('scanSpinner');
        const progressBar = document.getElementById('scanProgressBarInner');

        scanButton.disabled = true;
        scanButtonText.textContent = 'Taranıyor...';
        scanSpinner.classList.remove('d-none');
        progressBar.style.width = '0%';

        document.getElementById('scanResultInfo').textContent = 'Taranıyor...';
        document.getElementById('signalsContainer').innerHTML = '';
        document.getElementById('noSignalsMessage').classList.add('d-none');

        // Hacim filtresini al
        const minVolume = parseFloat(document.getElementById('volumeSelect').value) || 0;

        // Hacime göre sırala ve filtrele
        const coinsToScan = allCoins
          .filter(coin => {
              const data = coinData[coin.symbol];
              return data && data.volume >= minVolume;
          })
          .sort((a, b) => {
              const volumeA = coinData[a.symbol]?.volume || 0;
              const volumeB = coinData[b.symbol]?.volume || 0;
              return volumeB - volumeA;
          });

        // En yüksek hacimli 50 coini tara (API limitlerini aşmamak için)
        const coinLimit = Math.min(50, coinsToScan.length);
        const limitedCoins = coinsToScan.slice(0, coinLimit);

        console.log(`${limitedCoins.length} coin taranacak`);

        try {
            // 5'erli batch'ler halinde işlemek için
            const batchSize = 5;
            const delayBetweenBatches = 1000; // 1 saniye

            for (let i = 0; i < limitedCoins.length; i += batchSize) {
                const batch = limitedCoins.slice(i, i + batchSize);

                // Bu batch'deki tüm coinler için veri çek
                const batchPromises = batch.map(coin => {
                    return fetchCandlestickData(coin.symbol, currentTimeframe)
                      .then(data => {
                          if (data) {
                              // Sinyalleri analiz et
                              analyzeCoin(coin, data);
                          }
                      })
                      .catch(error => {
                          console.error(`${coin.symbol} hatası:`, error);
                      });
                });

                // Bu batch'deki tüm işlemleri bekle
                await Promise.all(batchPromises);

                // İlerleme durumunu güncelle
                const progress = Math.min(100, ((i + batchSize) / limitedCoins.length) * 100);
                progressBar.style.width = `${progress}%`;

                // İşlenen coin sayısı
                const processedCount = Math.min(i + batchSize, limitedCoins.length);
                document.getElementById('scanResultInfo').textContent =
                  `${processedCount}/${limitedCoins.length} coin tarandı, ${signals.length} sinyal bulundu`;

                // Bir sonraki batch'e geçmeden önce bekle
                if (i + batchSize < limitedCoins.length) {
                    await new Promise(resolve => setTimeout(resolve, delayBetweenBatches));
                }
            }

            // Taramayı bitir ve sonuçları göster
            isScanning = false;
            scanButton.disabled = false;
            scanButtonText.textContent = 'Tara';
            scanSpinner.classList.add('d-none');
            progressBar.style.width = '100%';

            // Sonuçları göster
            document.getElementById('scanResultInfo').textContent =
              `${limitedCoins.length} coin tarandı, ${signals.length} sinyal bulundu`;
            document.getElementById('lastScanTime').textContent = new Date().toLocaleTimeString();

            // Sinyalleri görüntüle
            filterSignals();

            // 1 saniye sonra progress bar'ı sıfırla
            setTimeout(() => {
                progressBar.style.width = '0%';
            }, 1000);

        } catch (error) {
            console.error('Tarama hatası:', error);
            isScanning = false;
            scanButton.disabled = false;
            scanButtonText.textContent = 'Tara';
            scanSpinner.classList.add('d-none');
            document.getElementById('scanResultInfo').textContent = `Hata: ${error.message}`;
        }
    }

    // Mum verilerini çek
    async function fetchCandlestickData(symbol, interval, limit = 50) {
        try {
            const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (!data || data.length < 30) {
                console.log(`${symbol} için yeterli veri yok`);
                return null;
            }

            // Veriyi işle
            const parsedData = {
                symbol: symbol,
                open: data.map(candle => parseFloat(candle[1])),
                high: data.map(candle => parseFloat(candle[2])),
                low: data.map(candle => parseFloat(candle[3])),
                close: data.map(candle => parseFloat(candle[4])),
                volume: data.map(candle => parseFloat(candle[5])),
                timestamp: data.map(candle => parseInt(candle[0]))
            };

            // Veriyi sakla
            historicalData[symbol] = parsedData;

            return parsedData;
        } catch (error) {
            console.error(`${symbol} verileri çekilemedi:`, error);
            return null;
        }
    }

    // Coin analizi yap ve sinyal üret
    function analyzeCoin(coin, data) {
        try {
            // Temel değerleri al
            const symbol = coin.symbol;
            const close = data.close;
            const volume = data.volume;

            // Basit indikatör hesaplamaları
            const ema20 = calculateEMA(close, 20);
            const ema50 = calculateEMA(close, 50);
            const rsi = calculateRSI(close, 14);

            // Son değerleri al
            const lastPrice = close[close.length - 1];
            const lastEMA20 = ema20[ema20.length - 1];
            const lastEMA50 = ema50[ema50.length - 1];
            const lastRSI = rsi[rsi.length - 1];

            // Trend belirle
            let trend = "neutral";
            let reasons = [];

            // Long (alış) sinyali kriterleri
            if (lastPrice > lastEMA20 && lastEMA20 > lastEMA50 && lastRSI > 50 && lastRSI < 70) {
                trend = "long";
                reasons = [
                    "Fiyat 20 EMA üzerinde",
                    "20 EMA 50 EMA'nın üzerinde (yükseliş trendi)",
                    "RSI 50 üzerinde (momentum yukarı yönlü)",
                    "RSI 70 altında (aşırı alım durumu yok)"
                ];
            }
            // Short (satış) sinyali kriterleri
            else if (lastPrice < lastEMA20 && lastEMA20 < lastEMA50 && lastRSI < 50 && lastRSI > 30) {
                trend = "short";
                reasons = [
                    "Fiyat 20 EMA altında",
                    "20 EMA 50 EMA'nın altında (düşüş trendi)",
                    "RSI 50 altında (momentum aşağı yönlü)",
                    "RSI 30 üzerinde (aşırı satım durumu yok)"
                ];
            }
            // Özel durumlar - aşırı alım/satım
            else if (lastRSI < 30 && lastPrice < lastEMA20) {
                trend = "long";
                reasons = [
                    "RSI 30 altında (aşırı satım)",
                    "Fiyat 20 EMA altında",
                    "Potansiyel dip bölgesi",
                    "Geri dönüş için izlenebilir"
                ];
            }
            else if (lastRSI > 70 && lastPrice > lastEMA20) {
                trend = "short";
                reasons = [
                    "RSI 70 üzerinde (aşırı alım)",
                    "Fiyat 20 EMA üzerinde",
                    "Potansiyel tepe bölgesi",
                    "Geri dönüş için izlenebilir"
                ];
            }

            // Eğer bir trend belirlendiuyse sinyal oluştur
            if (trend !== "neutral") {
                signals.push({
                    symbol: symbol,
                    baseAsset: coin.baseAsset,
                    price: lastPrice,
                    volume: coinData[symbol]?.volume || 0,
                    priceChangePercent: coinData[symbol]?.priceChangePercent || 0,
                    trend: trend,
                    ema20: lastEMA20,
                    ema50: lastEMA50,
                    rsi: lastRSI,
                    timeframe: currentTimeframe,
                    reasons: reasons
                });
            }
        } catch (error) {
            console.error(`${coin.symbol} analiz hatası:`, error);
        }
    }

    // EMA (Üssel Hareketli Ortalama) hesapla
    function calculateEMA(prices, period) {
        const k = 2 / (period + 1);
        let emaValues = [prices[0]];

        for (let i = 1; i < prices.length; i++) {
            const ema = prices[i] * k + emaValues[i - 1] * (1 - k);
            emaValues.push(ema);
        }

        return emaValues;
    }

    // RSI (Göreceli Güç Endeksi) hesapla
    function calculateRSI(prices, period = 14) {
        if (prices.length < period + 1) {
            return Array(prices.length).fill(50);
        }

        // Fiyat değişimlerini hesapla
        const changes = [];
        for (let i = 1; i < prices.length; i++) {
            changes.push(prices[i] - prices[i - 1]);
        }

        // Kazanç ve kayıpları ayır
        const gains = changes.map(change => change > 0 ? change : 0);
        const losses = changes.map(change => change < 0 ? Math.abs(change) : 0);

        // İlk ortalama kazanç ve kayıp
        let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
        let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;

        // RSI değerlerini hesapla
        const rsiValues = [];

        // İlk RSI değeri
        rsiValues.push(100 - (100 / (1 + avgGain / (avgLoss || 0.001))));

        // Diğer değerler
        for (let i = period; i < changes.length; i++) {
            avgGain = ((avgGain * (period - 1)) + gains[i]) / period;
            avgLoss = ((avgLoss * (period - 1)) + losses[i]) / period;

            const rs = avgGain / (avgLoss || 0.001);
            const rsi = 100 - (100 / (1 + rs));

            rsiValues.push(rsi);
        }

        return rsiValues;
    }

    // Sinyalleri filtrele
    function filterSignals() {
        // Filtre değerlerini al
        const signalType = document.getElementById('signalTypeSelect').value;
        const minVolume = parseFloat(document.getElementById('volumeSelect').value) || 0;
        const searchTerm = document.getElementById('searchInput').value.toUpperCase();

        // Filtreleri uygula
        const filteredSignals = signals.filter(signal => {
            // Sinyal tipine göre filtrele
            if (signalType !== 'all' && signal.trend !== signalType) {
                return false;
            }

            // Hacime göre filtrele
            if (signal.volume < minVolume) {
                return false;
            }

            // Arama terimine göre filtrele
            if (searchTerm && !signal.symbol.includes(searchTerm)) {
                return false;
            }

            return true;
        });

        // Sinyalleri göster
        displaySignals(filteredSignals);
    }

    // Sinyalleri görüntüle
    function displaySignals(filteredSignals) {
        const container = document.getElementById('signalsContainer');
        const noSignalsMessage = document.getElementById('noSignalsMessage');

        // Konteyneri temizle
        container.innerHTML = '';

        if (filteredSignals.length === 0) {
            noSignalsMessage.classList.remove('d-none');
        } else {
            noSignalsMessage.classList.add('d-none');

            // Her sinyal için kart oluştur
            filteredSignals.forEach(signal => {
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';

                // Fiyat değişimine göre renk belirle
                const priceChangeClass = signal.priceChangePercent >= 0 ? 'text-success' : 'text-danger';

                card.innerHTML = `
                <div class="card signal-${signal.trend}">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <img src="https://cryptoicons.org/api/icon/${signal.baseAsset.toLowerCase()}/24"
                                onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWNvaW4iPjxjaXJjbGUgY3g9IjEyIiBjeT0iMTIiIHI9IjgiLz48cGF0aCBkPSJNMTIgNnYxMk0xOCA4LjQgNiAxNS42Ii8+PC9zdmc+'"
                                class="coin-logo">
                            ${signal.symbol}
                        </div>
                        <span class="badge-${signal.trend}">${signal.trend === 'long' ? 'LONG' : 'SHORT'}</span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <div>
                                <h5 class="card-title mb-0">${formatPrice(signal.price)}</h5>
                                <small class="${priceChangeClass}">24s: ${signal.priceChangePercent >= 0 ? '+' : ''}${signal.priceChangePercent.toFixed(2)}%</small>
                            </div>
                            <div class="text-end">
                                <small class="text-muted">Hacim:</small><br>
                                <strong>${formatVolume(signal.volume)}</strong>
                            </div>
                        </div>

                        <div class="mb-3">
                            <h6>Temel İndikatörler:</h6>
                            <span class="indicator-value">EMA(20): <span class="${signal.price > signal.ema20 ? 'positive' : 'negative'}">${formatPrice(signal.ema20)}</span></span>
                            <span class="indicator-value">EMA(50): <span class="${signal.price > signal.ema50 ? 'positive' : 'negative'}">${formatPrice(signal.ema50)}</span></span>
                            <span class="indicator-value">RSI(14): <span class="${signal.rsi > 70 ? 'negative' : signal.rsi < 30 ? 'positive' : ''}">${signal.rsi.toFixed(1)}</span></span>
                        </div>

                        <div>
                            <h6>Sinyal Nedenleri:</h6>
                            <div class="signal-reasons">
                                ${signal.reasons.map(reason => `<div class="signal-reason">• ${reason}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">${signal.timeframe} zaman dilimi</small>
                        <a href="https://www.tradingview.com/chart/?symbol=BINANCE:${signal.symbol}" target="_blank" class="btn btn-sm btn-outline-primary float-end">
                            Grafikte Göster
                        </a>
                    </div>
                </div>
            `;

                container.appendChild(card);
            });
        }

        // Toplam sinyal bilgisini güncelle
        document.getElementById('scanResultInfo').textContent =
          `${signals.length} sinyal bulundu, ${filteredSignals.length} sinyal gösteriliyor`;
    }

    // Fiyatı formatla
    function formatPrice(price) {
        if (price >= 1000) {
            return price.toFixed(2);
        } else if (price >= 1) {
            return price.toFixed(4);
        } else if (price >= 0.0001) {
            return price.toFixed(6);
        } else {
            return price.toFixed(8);
        }
    }

    // Hacmi formatla
    function formatVolume(volume) {
        if (volume >= 1e9) {
            return (volume / 1e9).toFixed(2) + 'B';  // Milyar
        } else if (volume >= 1e6) {
            return (volume / 1e6).toFixed(2) + 'M';  // Milyon
        } else if (volume >= 1e3) {
            return (volume / 1e3).toFixed(2) + 'K';  // Bin
        } else {
            return volume.toFixed(2);  // Normal değer
        }
    }
</script>
</body>
</html>
